server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── En-têtes de sécurité (toutes les réponses ; `always` = aussi les erreurs).
    # PIÈGE nginx : une location qui pose son propre add_header (ex. Cache-Control)
    # n'hérite PLUS de ceux-ci -> ils sont répétés dans /assets/ et index.html.
    # - HSTS : force le HTTPS pendant 180 jours.
    # - nosniff : le navigateur ne « devine » plus le type d'un fichier.
    # - SAMEORIGIN : interdit d'encadrer le site dans une iframe (anti-clickjacking).
    # - CSP : liste blanche de ce que les pages peuvent charger (fonts Google,
    #   tuiles OSM, et rien d'autre) — neutralise l'essentiel des XSS.
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://us-assets.i.posthog.com 'sha256-hDdQHSfEnwYMQz2rdvdZqIDJDR2YHQRe8+PegjbK8xk='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://tile.openstreetmap.org https://us.i.posthog.com; connect-src 'self' https://us.i.posthog.com https://us-assets.i.posthog.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # API NestJS (préfixe global /api) → service api:3000
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pages SEO (générées par l'API, hors préfixe /api) : /territoires, /<dept>,
    # /<dept>/<commune>. Routage GÉNÉRIQUE (toute la France, pas de liste à maintenir) :
    # un chemin à 1 ou 2 segments de slug est tenté côté API ; si le slug est inconnu
    # (404), on retombe sur la SPA. /api et /assets sont exclus (gérés ailleurs) ; les
    # fichiers (avec un point, ex. .png/.txt) ne matchent pas et restent servis en statique.
    location ~ ^/(?!api/|assets/)[a-z0-9-]+(/[a-z0-9-]+)?/?$ {
        rewrite ^(.*)$ /api/seo$1 break;
        proxy_pass http://api:3000;
        proxy_intercept_errors on;
        error_page 404 = @spa;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Repli : slug inconnu de l'API -> on sert l'app (SPA).
    location @spa {
        rewrite ^ /index.html last;
    }
    location = /sitemap.xml {
        proxy_pass http://api:3000/api/seo/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Manifest d'appli (installation sur téléphone) : type MIME absent de mime.types.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }
    # robots.txt et llms.txt sont générés par l'API (domaine = SITE_URL, chiffres du jour).
    location ~ ^/(robots|llms)\.txt$ {
        rewrite ^/(.*)$ /api/seo/$1 break;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Images de partage dynamiques (/og/<dept>/<commune>.png…). Cloudflare les met
    # en cache grâce au Cache-Control renvoyé par l'API.
    location ^~ /og/ {
        rewrite ^(.*)$ /api/seo$1 break;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Liste intégrable en iframe chez les mairies/offices de tourisme : SEUL endroit
    # où l'on autorise l'affichage dans un autre site. add_header ici REMPLACE ceux du
    # bloc server (héritage coupé) : X-Frame-Options volontairement absent.
    location ^~ /embed/ {
        rewrite ^(.*)$ /api/seo$1 break;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; script-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors *" always;
        add_header Cache-Control "public, max-age=3600" always;
    }
    # Sous-sitemaps /sitemap-0.xml, /sitemap-1.xml… (index découpé < 50 000 URL).
    location ~ ^/sitemap-(\d+)\.xml$ {
        rewrite ^/sitemap-(\d+)\.xml$ /api/seo/sitemap-part/$1 break;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets Vite (noms content-hashés : index-AbC123.js). Le nom change à CHAQUE
    # build → on peut les cacher « pour toujours » sans risque de version périmée.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Répétés ici car le add_header ci-dessus coupe l'héritage du niveau server.
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # index.html ne doit JAMAIS être figé : sinon un visiteur garde un vieux HTML
    # qui référence des bundles supprimés au déploiement suivant → page blanche /
    # « vieux site » sur certains navigateurs. no-cache = revalidé à chaque visite
    # (304 si inchangé, quasi gratuit).
    location = /index.html {
        add_header Cache-Control "no-cache";
        # Répétés ici car le add_header ci-dessus coupe l'héritage du niveau server.
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://us-assets.i.posthog.com 'sha256-hDdQHSfEnwYMQz2rdvdZqIDJDR2YHQRe8+PegjbK8xk='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://tile.openstreetmap.org https://us.i.posthog.com; connect-src 'self' https://us.i.posthog.com https://us-assets.i.posthog.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── Anciennes adresses → carteasso.fr (301 permanente, le chemin est conservé :
# gemenskarte.fr/vendee/challans → carteasso.fr/vendee/challans). Google transfère ainsi
# le référencement. Garder gemenskarte.fr au moins un an (renommage du 20/11/2026).
# /api/ reste servie sur l'ancien domaine : des outils l'appellent encore (CRM FCF)
# et un proxy ne suit pas les redirections. Le bloc ci-dessus reste le serveur par défaut.
server {
    listen 80;
    server_name gemenskarte.fr www.gemenskarte.fr www.carteasso.fr;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://carteasso.fr$request_uri;
    }
}
