# Déploiement complet CarteAsso sur your-server (tout en conteneurs).
# Web exposé en :8088 sur la machine seulement (127.0.0.1) : le public passe par le
# tunnel Cloudflare (cloudflared, réseau hôte -> localhost:8088), jamais en direct. DB/Meili en réseau interne (pas de port hôte :
# 5432 est déjà pris par un autre service sur la machine).
services:
  db:
    image: postgis/postgis:16-3.6
    container_name: ca-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: carteasso
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: carteasso
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carteasso -d carteasso"]
      interval: 5s
      timeout: 5s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: ca-search
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
    volumes:
      - meili_data:/meili_data

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    container_name: ca-api
    # Journaux Docker (adresses IP des visiteurs) : rotation à 3 × 10 Mo, soit quelques
    # semaines au plus. Promis dans /confidentialite : ne pas retirer sans changer la page.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      DATABASE_URL: ${DATABASE_URL}
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      BAN_GEOCODER_URL: https://api-adresse.data.gouv.fr
      # Jeton admin lu depuis le fichier .env (gitignoré). Vide -> routes admin fermées.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Domaine public (canonical, sitemap, partages). À passer à https://carteasso.fr
      # dans .env le jour de la bascule (+ rebuild web, qui l'injecte dans index.html).
      SITE_URL: ${SITE_URL:-https://carteasso.fr}
      # Formulaire de contact -> email. Définis SMTP_USER/SMTP_PASS dans .env (gitignoré).
      # Tant qu'ils sont vides, l'API n'envoie pas d'email (mode "console only").
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      # Adresse d'expéditeur (domaine vérifié chez le fournisseur SMTP). Sans elle, l'API prend
      # SMTP_USER, qui n'est pas une adresse chez Resend -> « 501 Bad sender address ».
      SMTP_FROM: ${SMTP_FROM:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-contact@example.com}
      # Mentions légales : nom de l'éditeur et SIRET (laissés vides = non affichés).
      EDITEUR_NOM: ${EDITEUR_NOM:-}
      EDITEUR_SIRET: ${EDITEUR_SIRET:-}
    # Données RNA montées depuis l'hôte (gros fichiers livrés sans reconstruire l'image).
    volumes:
      - ./data/rna:/app/data/rna
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        SITE_URL: ${SITE_URL:-https://carteasso.fr}
    container_name: ca-web
    # Journaux Docker (adresses IP des visiteurs) : rotation à 3 × 10 Mo, soit quelques
    # semaines au plus. Promis dans /confidentialite : ne pas retirer sans changer la page.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  enrich:
    build:
      context: .
      dockerfile: deploy/Dockerfile.enrich
    container_name: ca-enrich
    restart: on-failure
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy

  scrape_mairie:
    build:
      context: .
      dockerfile: deploy/Dockerfile.enrich
    container_name: ca-scrape
    restart: no
    profiles: [scrape]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: python -u scrape_mairie.py --sleep 2.0
    volumes:
      - ./tools/enrichment:/output
    depends_on:
      db:
        condition: service_healthy

  press_enrich:
    build:
      context: .
      dockerfile: deploy/Dockerfile.enrich
    container_name: ca-press
    restart: "no"
    profiles: [press]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: python -u enrich_press.py --sleep 2.0
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  meili_data:
